[package]
name = "happiness-scanner"
version = "0.1.0"
edition = "2021"
description = "Background BTC wallet scanner on Rust + Tauri for Windows 11"
authors = ["Happiness for parents"]

[dependencies]
tauri = { version = "2", default-features = false }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
bip39 = "4"
bip32 = "0.9"
secp256k1 = "0.28"
bitcoin = "0.31"
base58 = "0.2"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
